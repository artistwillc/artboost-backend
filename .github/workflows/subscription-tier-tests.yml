name: Subscription tier unit tests
on:
  pull_request:
    paths:
      - 'backend/server.js'
      - 'backend/services/subscriptionTier.js'
      - 'backend/services/verifySchedulingUser.js'
      - 'backend/tests/subscriptionTier.test.js'
      - 'backend/tests/verifySchedulingUser.test.js'
      - 'backend/tests/schedulingRouteCompatibility.test.js'
      - 'services/subscriptionTier.js'
      - 'tests/subscriptionTier.test.js'
      - 'services/verifySchedulingUser.js'
      - 'tests/verifySchedulingUser.test.js'
      - '.github/workflows/subscription-tier-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production entrypoint syntax
        run: node --check backend/server.js && node --check backend/services/subscriptionTier.js && node --check backend/services/verifySchedulingUser.js
      - name: Run subscription resolver tests
        run: node --test tests/subscriptionTier.test.js tests/verifySchedulingUser.test.js backend/tests/subscriptionTier.test.js backend/tests/verifySchedulingUser.test.js backend/tests/schedulingRouteCompatibility.test.js
