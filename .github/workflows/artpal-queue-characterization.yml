name: ArtPal queue characterization
on:
  pull_request:
    paths:
      - "backend/tests/artpal-queue-characterization.test.js"
      - ".github/workflows/artpal-queue-characterization.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check backend/tests/artpal-queue-characterization.test.js
      - run: node --test backend/tests/artpal-queue-characterization.test.js
