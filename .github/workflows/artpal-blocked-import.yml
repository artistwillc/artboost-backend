name: ArtPal blocked import queue
on:
  pull_request:
    paths:
      - "backend/services/catalogImportQueueService.js"
      - "backend/tests/artpal-403-queue-regression.test.js"
      - ".github/workflows/artpal-blocked-import.yml"
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check backend/services/catalogImportQueueService.js
      - run: node --test backend/tests/artpal-403-queue-regression.test.js
