name: ArtBoost Web Export Check

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/scripts/buildWebApp.mjs"
      - "backend/scripts/verifyWebExport.mjs"
      - "backend/website/**"
      - ".github/workflows/web-export-check.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/scripts/buildWebApp.mjs"
      - "backend/scripts/verifyWebExport.mjs"
      - "backend/website/**"
      - ".github/workflows/web-export-check.yml"
  workflow_dispatch:

concurrency:
  group: artboost-web-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      ARTBOOST_WEB_EXPORT: "1"
      EXPO_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_build_validation_only"
      EXPO_PUBLIC_API_URL: "https://artboostai.com"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Export Expo web app
        run: npm run export:web

      - name: Verify required flagship routes
        working-directory: .
        run: node backend/scripts/verifyWebExport.mjs

      - name: Verify flagship static website
        working-directory: .
        run: |
          test -s backend/website/index.html
          test -s backend/website/styles.css
          test -s backend/website/script.js
          grep -Fq 'https://apps.apple.com/us/app/artboost-ai/id6784803136' backend/website/index.html
          grep -Fq 'href="/subscribe/starter"' backend/website/index.html
          grep -Fq 'href="/subscribe/pro"' backend/website/index.html
          grep -Fq 'href="/subscribe/business"' backend/website/index.html
          grep -Fq 'accountParams.get("account")' backend/website/script.js
          grep -Fq 'accountParams.get("tier")' backend/website/script.js
          if grep -Fq 'https://artboost-ai.onrender.com/subscribe/' backend/website/index.html; then
            echo "Flagship pricing must not use the legacy Render subscription hostname."
            exit 1
          fi
